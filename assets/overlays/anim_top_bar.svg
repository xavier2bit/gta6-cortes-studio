<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="150" viewBox="0 0 1080 150">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#9D00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- TOP HOOK CONTAINER -->
  <g filter="url(#neonGlow)">
    <rect x="50" y="10" width="980" height="96" rx="22" fill="#0C0714" fill-opacity="0.94" stroke="url(#neonGrad)" stroke-width="3"/>
    
    <!-- BADGE -->
    <rect x="75" y="28" width="170" height="60" rx="14" fill="#FF0055" />
    <text x="160" y="68" font-family="Montserrat, Arial Black, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GTA VI</text>
    
    <!-- HOOK TITLE -->
    <text x="625" y="70" font-family="Montserrat, Arial Black, sans-serif" font-size="31" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DAVY JONES REAGIU AO GTA 6!</text>
  </g>
</svg>
