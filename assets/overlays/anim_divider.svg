<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="120" viewBox="0 0 1080 120">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#9D00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- CENTER SPLIT DIVIDER -->
  <rect x="0" y="55" width="1080" height="10" fill="url(#neonGrad)" filter="url(#neonGlow)" />
  
  <!-- CENTER GTA VI BADGE -->
  <g filter="url(#neonGlow)">
    <rect x="440" y="15" width="200" height="90" rx="20" fill="#0D0818" stroke="url(#neonGrad)" stroke-width="4"/>
    <text x="540" y="78" font-family="Georgia, Times New Roman, serif" font-size="56" font-weight="bold" fill="url(#neonGrad)" text-anchor="middle" font-style="italic" letter-spacing="4">VI</text>
  </g>

  <!-- HUD ACCENTS -->
  <circle cx="80" cy="60" r="7" fill="#00F0FF" filter="url(#neonGlow)"/>
  <circle cx="1000" cy="60" r="7" fill="#FF007F" filter="url(#neonGlow)"/>
</svg>
